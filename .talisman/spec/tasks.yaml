version: 1
project:
  id: physics-engine-benchmark
  name: 机器人仿真物理引擎对比
tasks:
  - id: benchmark.cpu_baseline
    title: task01 三个 MuJoCo CPU 基础实验
    kind: code
    owner_role: developer
    status: ready
    risk: low
    depends_on: []
    inputs:
      - .talisman/dev_docs/2026-10/task01_我做这个实验对比.md
    outputs:
      - src/physics_benchmark/
      - configs/baseline.json
      - docs/benchmark.md
    acceptance:
      - 三个场景各两种步长且每组独立重复三次
      - 导出原始状态、力、冲量、导入参数和软硬件版本
      - 动量平衡和铰链独立 ODE 参考校验通过
      - 曲线、指标、失败记录和使用说明可用
  - id: example.task.bootstrap
    title: 初始化项目控制面
    kind: docs
    owner_role: architect-agent
    status: ready
    risk: low
    depends_on: []
    inputs:
      - .talisman/docs/PRD.md
      - .talisman/docs/ARCH.md
    outputs:
      - .talisman/spec/tasks.yaml
      - .talisman/runtime/state.yaml
    acceptance:
      - 最小模板已填充
      - 允许修改目录已定义
      - 首批任务可进入执行